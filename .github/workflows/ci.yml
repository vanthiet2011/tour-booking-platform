name: Fullstack CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # =======================
  # Backend (.NET)
  # =======================
  build-backend:
    name: 🛡️ Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore Dependencies
        run: |
          find backend -name "*.csproj" -print0 | while IFS= read -r -d '' file; do
            dotnet restore "$file"
          done

      - name: Build Services
        run: |
          find backend -name "*.csproj" -print0 | while IFS= read -r -d '' file; do
            dotnet build "$file" --configuration Release --no-restore
          done

      - name: Run Tests
        run: |
          if find backend -name "*Test.csproj" | grep -q .; then
            find backend -name "*Test.csproj" -print0 | while IFS= read -r -d '' file; do
              dotnet test "$file" --no-restore
            done
          else
            echo "No test projects found"
          fi

  # =======================
  # Frontend (Next.js)
  # =======================
  build-frontend:
    name: 🎨 Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/my-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/my-app/package-lock.json"

      - name: Install Dependencies
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
