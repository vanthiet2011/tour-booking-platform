name: Fullstack CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # JOB 1: BACKEND (Build & Test tất cả Microservices)
  build-backend:
    name: 🛡️ Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore Dependencies
        run: dotnet restore backend/**/*.csproj

      - name: Build All Services
        run: |
          for file in backend/**/*.csproj; do
            dotnet build "$file" --configuration Release --no-restore
          done

      - name: Run Tests
        run: |
          # Chỉ chạy test nếu tìm thấy project có tên chứa chữ "Test"
          if find backend -name "*Test.csproj" | grep -q .; then
            dotnet test backend/**/*.csproj --no-restore --verbosity normal
          else
            echo "⚠️ No test projects found. Skipping tests."
          fi

  # JOB 2: FRONTEND (Lint & Build Check Next.js)
  build-frontend:
    name: 🎨 Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/my-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/my-app/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code (Check Syntax)
        run: npm run lint

      - name: Build Check (Check Type Errors)
        run: npm run build
