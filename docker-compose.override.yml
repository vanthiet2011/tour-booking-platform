# docker-compose.override.yml
version: "3.9"
services:
  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend/my-app:/app
      - node_modules_cache:/app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
      - INTERNAL_API_URL=http://gateway:8080/api
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

  gateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend/ApiGateway:/src
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    ports:
      - "8000:8080"

  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
      target: dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./backend/AuthService:/src
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    command: dotnet watch run --project AuthService.csproj --urls http://0.0.0.0:8080 --no-launch-profile

  user-service:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
      target: dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./backend/UserService:/src
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    command: dotnet watch run --project UserService.csproj --urls http://0.0.0.0:8080 --no-launch-profile

  tour-service:
    build:
      context: ./backend/TourService
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend/TourService:/src
      - ./backend/TourService/wwwroot/uploads:/app/wwwroot/uploads
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    command: dotnet watch run --project TourService.csproj --urls http://0.0.0.0:8080 --no-launch-profile

  booking-service:
    build:
      context: ./backend/BookingService
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend/BookingService:/src
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    command: dotnet watch run --project BookingService.csproj --urls http://0.0.0.0:8080 --no-launch-profile

  payment-service:
    build:
      context: ./backend/PaymentService
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend/PaymentService:/src
      - ~/.nuget/packages:/root/.nuget/packages:ro
      - /src/bin
      - /src/obj
    command: dotnet watch run --project PaymentService.csproj --urls http://0.0.0.0:8080 --no-launch-profile
