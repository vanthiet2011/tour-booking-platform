version: "3.8"

services:
  #---------------------------------
  # INFRASTRUCTURE SERVICES
  #---------------------------------
  gateway:
    build:
      context: ./backend/ApiGateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - auth-service
      - user-service
      - tour-service
      - booking-service
      - payment-service
    networks:
      - app-net

  auth_db:
    image: postgres:14-alpine
    container_name: auth_db
    restart: always
    environment:
      - POSTGRES_DB=AuthDb
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5432:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - app-net

  user_db:
    image: postgres:14-alpine
    container_name: user_db
    restart: always
    environment:
      - POSTGRES_DB=UserDb
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - app-net

  tour_db:
    image: postgres:14-alpine
    container_name: tour_db
    restart: always
    environment:
      - POSTGRES_DB=TourDb
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5434:5432"
    volumes:
      - tour_data:/var/lib/postgresql/data
    networks:
      - app-net

  booking_db:
    image: postgres:14-alpine
    container_name: booking_db
    restart: always
    environment:
      - POSTGRES_DB=BookingDb
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5435:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    networks:
      - app-net

  payment_db:
    image: postgres:14-alpine
    container_name: payment_db
    restart: always
    environment:
      - POSTGRES_DB=PaymentDb
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5436:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    networks:
      - app-net

  redis_cache:
    image: redis:6-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net

  #-----------------------------
  # KAFKA + ZOOKEEPER + KAFDROP
  #-----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    networks:
      - app-net
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-net

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    restart: always
    ports:
      - "19000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
      SERVER_PORT: 9000
    depends_on:
      - kafka
    networks:
      - app-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - app-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.1
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - app-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-net

  #---------------------------------
  # APPLICATION SERVICES
  #---------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules_cache:/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app-net
  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=auth_db;Port=5432;Database=AuthDb;Username=your_user;Password=your_password
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - auth_db
      - kafka
    networks:
      - app-net

  user-service:
    build:
      context: ./backend/UserService
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=user_db;Port=5432;Database=UserDb;Username=your_user;Password=your_password
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - user_db
      - kafka
    networks:
      - app-net

  tour-service:
    build:
      context: ./backend/TourService
      dockerfile: Dockerfile
    container_name: tour-service
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=tour_db;Port=5432;Database=TourDb;Username=your_user;Password=your_password
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - tour_db
      - kafka
    networks:
      - app-net

  booking-service:
    build:
      context: ./backend/BookingService
      dockerfile: Dockerfile
    container_name: booking-service
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=booking_db;Port=5432;Database=BookingDb;Username=your_user;Password=your_password
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - booking_db
      - kafka
    networks:
      - app-net

  payment-service:
    build:
      context: ./backend/PaymentService
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=payment_db;Port=5432;Database=PaymentDb;Username=your_user;Password=your_password
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      - payment_db
      - kafka
    networks:
      - app-net

  search-service:
    build:
      context: ./backend/SearchService
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Elasticsearch__Uri=http://elasticsearch:9200
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=search-service-group
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - app-net

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - gateway
    restart: always
    networks:
      - app-net

#---------------------------------
# VOLUMES & NETWORK
#---------------------------------
volumes:
  auth_data:
  user_data:
  tour_data:
  booking_data:
  payment_data:
  redis_data:
  node_modules_cache:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  app-net:
    driver: bridge
